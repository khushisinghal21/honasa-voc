# Products tracked by the POC. Edit freely.
#   match_terms: lowercase phrases that indicate a comment is about this product
#                (used to keep Reddit comments; the LLM relevance check does the rest)
#   youtube.search_queries: used to discover review videos (each search costs 100 API quota units)
#   youtube.video_ids: pin specific videos you've hand-picked (cheaper and higher quality)
#   reddit: subreddits + queries. Verify the subreddits are active before a big run.
products:
  - id: me_rosemary_shampoo
    brand: Mamaearth
    name: Mamaearth Rosemary Anti-Hair Fall Shampoo
    category: shampoo
    is_competitor: false
    match_terms: ["rosemary shampoo", "mamaearth rosemary"]
    youtube:
      search_queries: ["mamaearth rosemary shampoo review", "mamaearth rosemary shampoo honest review"]
      video_ids: []
    reddit:
      subreddits: [IndianSkincareAddicts, IndianHaircareAddicts]
      queries: ["mamaearth rosemary shampoo", "mamaearth rosemary"]

